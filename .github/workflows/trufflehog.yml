name: "Security: TruffleHog"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  TruffleHog:
    name: TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 retrieves the full git history so TruffleHog can scan
          # every commit when running on a push to main.
          fetch-depth: 0
          persist-credentials: false

      # On push to main: scan the entire git history for verified secrets.
      - name: TruffleHog scan (full history – push to main)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified

      # On pull requests: scope the scan to the diff between base and head
      # commits only, keeping CI fast and avoiding re-flagging old history.
      - name: TruffleHog scan (PR diff only)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
